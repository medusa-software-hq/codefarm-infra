name: Check skip-apply label
description: >-
  Says whether the push merged a pull request labeled `skip-apply`, so as not to apply it; a manual
  run always applies

outputs:
  skip:
    description: '`true` if a merged pull request has the label'
    value: ${{ steps.check.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Check the merged pull requests' labels
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != push ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        labeled=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
          --jq '[.[] | select(any(.labels[]; .name == "skip-apply")) | "[#\(.number)](\(.html_url))"] | join(", ")')

        if [ -n "$labeled" ]; then
          echo "Skipped applying: $labeled has the \`skip-apply\` label" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
