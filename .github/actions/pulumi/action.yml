name: Pulumi
description: Runs a Pulumi command on a stack, logged in to GCP as a service account

inputs:
  command:
    description: The Pulumi command, e.g. preview or up
    required: true
  program:
    description: The program's directory under infra/, e.g. app
    required: true
  stack:
    description: The stack's name, e.g. staging
    required: true
  backend-url:
    description: The stack's state backend, e.g. gs://codefarm-app-staging-state-…
    required: true
  identity-provider:
    description: The workload identity provider that trusts the workflow's GitHub token
    required: true
  service-account:
    description: The service account to act as
    required: true
  comment-on-pr:
    description: Whether to post the result as a pull request comment
    default: "false"
  cloudflare-api-token-secret:
    description: The Secret Manager secret holding the Cloudflare API token, if the stack needs one
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: infra/.nvmrc

    - name: Install dependencies
      shell: bash
      working-directory: infra
      run: corepack yarn install --immutable

    - name: Log in to GCP
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Read the Cloudflare API token
      id: cloudflare
      if: inputs.cloudflare-api-token-secret != ''
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: api-token:${{ inputs.cloudflare-api-token-secret }}

    - name: Run pulumi ${{ inputs.command }}
      uses: pulumi/actions@v7.0.0
      env:
        # The state holds no secrets
        PULUMI_CONFIG_PASSPHRASE: ""
        # Without a secret, whatever the caller set, like the previews' placeholder
        CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.api-token || env.CLOUDFLARE_API_TOKEN }}
      with:
        command: ${{ inputs.command }}
        stack-name: ${{ inputs.stack }}
        work-dir: infra/${{ inputs.program }}
        cloud-url: ${{ inputs.backend-url }}
        upsert: true
        comment-on-pr: ${{ inputs.comment-on-pr }}
        github-token: ${{ github.token }}
