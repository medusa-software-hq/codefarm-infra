name: Preview base

on:
  pull_request:
    paths:
      - infra/*
      - infra/base/**
      - .github/actions/pulumi/**
      - .github/workflows/preview-base.yml

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  NO_COLOR: 1
  # The root project's pool trusts the reader, which the foundation gave Codefarm
  ROOT_POOL_PROVIDER: projects/626887270411/locations/global/workloadIdentityPools/github/providers/github-actions

# No GitHub environments here: they'd change the token's subject from pull_request
jobs:
  preview-base:
    name: Preview base
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pulumi
        with:
          command: preview
          program: base
          stack: main
          backend-url: gs://codefarm-base-state-39b22f38
          identity-provider: ${{ env.ROOT_POOL_PROVIDER }}
          service-account: reader@codefarm-x-07da3c.iam.gserviceaccount.com
          comment-on-pr: true
