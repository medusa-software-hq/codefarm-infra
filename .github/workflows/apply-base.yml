name: Apply base

on:
  push:
    branches: [main]
    paths:
      - infra/*
      - infra/base/**
      - .github/actions/pulumi/**
      - .github/workflows/apply-base.yml
  workflow_dispatch:

concurrency:
  group: apply-base

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  # The root project's pool trusts the identities the foundation gave Codefarm
  ROOT_POOL_PROVIDER: projects/626887270411/locations/global/workloadIdentityPools/github/providers/github-actions

jobs:
  check-skip-apply-label:
    name: Check for the skip-apply label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - uses: actions/checkout@v7.0.1

      - id: check
        uses: ./.github/actions/check-skip-apply-label

  apply-base:
    name: Apply base
    needs: check-skip-apply-label
    if: needs.check-skip-apply-label.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pulumi
        with:
          command: up
          program: base
          stack: main
          backend-url: gs://codefarm-base-state-39b22f38
          identity-provider: ${{ env.ROOT_POOL_PROVIDER }}
          service-account: base-provisioner@codefarm-x-07da3c.iam.gserviceaccount.com
