name: Apply

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/actions/**
      - .github/workflows/apply.yml
  workflow_dispatch:

concurrency:
  group: apply

permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1
  # The root project's pool trusts the identities the foundation gave Codefarm; Codefarm's pool, the rest
  ROOT_POOL_PROVIDER: projects/626887270411/locations/global/workloadIdentityPools/github/providers/github-actions
  CODEFARM_POOL_PROVIDER: projects/76431914348/locations/global/workloadIdentityPools/github/providers/github-actions

jobs:
  apply-base:
    name: Apply base
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pulumi
        with:
          command: up
          program: base
          stack: main
          backend-url: gs://codefarm-base-state-39b22f38
          identity-provider: ${{ env.ROOT_POOL_PROVIDER }}
          service-account: base-provisioner@codefarm-x-07da3c.iam.gserviceaccount.com

  apply-staging:
    name: Apply staging
    needs: apply-base
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Apply the app's credentials
        uses: ./.github/actions/pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MINTER_TOKEN }}
        with:
          command: up
          program: app-credentials
          stack: staging
          backend-url: gs://codefarm-app-staging-state-467db353
          identity-provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service-account: app-provisioner@codefarm-s-c20d22.iam.gserviceaccount.com

      - name: Apply the app
        uses: ./.github/actions/pulumi
        with:
          command: up
          program: app
          stack: staging
          backend-url: gs://codefarm-app-staging-state-467db353
          identity-provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service-account: app-provisioner@codefarm-s-c20d22.iam.gserviceaccount.com

  apply-production:
    name: Apply production
    needs: apply-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Apply the app's credentials
        uses: ./.github/actions/pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MINTER_TOKEN }}
        with:
          command: up
          program: app-credentials
          stack: production
          backend-url: gs://codefarm-app-production-state-050c18a3
          identity-provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service-account: app-provisioner@codefarm-p-3d2dea.iam.gserviceaccount.com

      - name: Apply the app
        uses: ./.github/actions/pulumi
        with:
          command: up
          program: app
          stack: production
          backend-url: gs://codefarm-app-production-state-050c18a3
          identity-provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service-account: app-provisioner@codefarm-p-3d2dea.iam.gserviceaccount.com
