name: Generate Pulumi data key

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment whose KMS key encrypts the data key
        type: environment
        required: true

permissions:
  id-token: write

env:
  NO_COLOR: 1
  CODEFARM_POOL_PROVIDER: projects/76431914348/locations/global/workloadIdentityPools/github/providers/github-actions

jobs:
  generate-pulumi-data-key:
    name: Generate Pulumi data key
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      PROJECT: ${{ fromJSON('{"staging":"codefarm-s-c20d22","production":"codefarm-p-3d2dea"}')[inputs.environment] }}

    steps:
      - name: Log in to GCP as the data key generator
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.CODEFARM_POOL_PROVIDER }}
          service_account: data-key-generator@${{ env.PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3.0.1

      # The data key's plaintext only ever exists in this pipe
      - name: Generate and encrypt the data key
        run: |
          key="projects/$PROJECT/locations/europe-central2/keyRings/pulumi/cryptoKeys/secrets"
          encrypted=$(head -c 32 /dev/urandom |
            gcloud kms encrypt --key="$key" --plaintext-file=- --ciphertext-file=- |
            base64 -w0)
          config="secretsprovider: gcpkms://$key
          encryptedkey: $encrypted"
          echo "$config"
          printf '```yaml\n%s\n```\n' "$config" >> "$GITHUB_STEP_SUMMARY"
